server:
  port: 8080

spring:
  application:
    name: geodemo-server
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/geodemo
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

geodemo:
  deepseek:
    base-url: https://api.deepseek.com
    model: deepseek-chat
    api-key: ${DEEPSEEK_API_KEY:}

logging:
  level:
    root: info
    com.geodemo: debug
