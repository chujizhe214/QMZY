<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="透镜 GEO 生成式引擎优化平台产品原型">
  <title>透镜 GEO · 生成式引擎优化平台</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand-logo">
        <div class="logo-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div><strong>透镜 <em>GEO</em></strong><small>生成式引擎优化平台</small></div>
      </div>
      <div class="workspace-switch" id="workspace-switch" role="button" tabindex="0" aria-label="切换品牌工作台">
        <div class="brand-avatar" id="brand-avatar">澄</div>
        <div class="workspace-copy"><small>当前品牌工作台</small><strong id="sidebar-brand">澄光生物</strong></div>
        <span data-icon="chevrons"></span>
      </div>
      <nav id="main-nav"></nav>
      <div class="sidebar-bottom">
        <div class="usage-card">
          <div class="usage-title"><span>专业版</span><small>本月额度</small></div>
          <div class="usage-value"><strong>7,240</strong><span>/ 10,000 积分</span></div>
          <div class="progress-track"><i style="width:72.4%"></i></div>
          <button class="text-button" data-action="upgrade">升级企业版 <span>→</span></button>
        </div>
        <button class="user-card" data-action="profile">
          <span class="user-avatar">林</span>
          <span><strong>林晓</strong><small>品牌运营管理员</small></span>
          <i data-icon="more"></i>
        </button>
      </div>
    </aside>
    <div class="sidebar-mask" id="sidebar-mask"></div>
    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu" id="mobile-menu" aria-label="打开菜单"><span data-icon="menu"></span></button>
          <div class="breadcrumb"><span id="breadcrumb-parent">工作台</span><i>/</i><strong id="breadcrumb-current">品牌总览</strong></div>
        </div>
        <div class="topbar-actions">
          <button class="search-trigger" data-action="search"><span data-icon="search"></span><span>搜索功能、报告或稿件</span><kbd>⌘ K</kbd></button>
          <span class="freshness"><i></i> 数据更新于 10:30</span>
          <button class="icon-button notification-button" data-action="notifications" aria-label="通知"><span data-icon="bell"></span><b>3</b></button>
          <button class="help-button" data-action="help" aria-label="帮助"><span data-icon="help"></span></button>
        </div>
      </header>
      <div id="view" class="view" tabindex="-1"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <script src="./core.js"></script>
  <script src="./pages-overview.js"></script>
  <script src="./pages-monitoring.js"></script>
  <script src="./pages-insights.js"></script>
  <script src="./pages-writing.js"></script>
  <script src="./pages-distribution.js"></script>
  <script src="./pages-attribution.js"></script>
  <script src="./pages-agent.js"></script>
  <script src="./pages-commerce.js"></script>
  <script src="./pages-workspaces.js"></script>
  <script src="./modals.js"></script>
  <script src="./app.js"></script>
  <script src="./api.js"></script>
</body>
</html>
